[build-system]
requires=["setuptools>=77"]
build-backend="setuptools.build_meta"

[project]
name="agent-workflow-benchmark"
version="0.4.1"
description="Optional comparative benchmark plugin for Agent-Workflow"
readme="README.md"
authors=[{name="ngallodev-software"}]
keywords=["agent-workflow","agentic-ai","coding-agents","benchmarking","evaluation","reproducibility","evidence"]
requires-python=">=3.11"
license="Apache-2.0"
dependencies=["agent-workflow>=0.11.10,<0.12","agent-workflow-comparative-eval==0.2.0","jsonschema>=4.18,<5"]

[project.urls]
Homepage="https://ngallodev-software.uk/projects/agent-workflow"
Repository="https://github.com/ngallodev-software/agent-workflow-benchmark"
AgentWorkflow="https://github.com/ngallodev-software/agent-workflow"
Results="https://github.com/ngallodev-software/agent-workflow-benchmark-results"

[project.optional-dependencies]
visual=["playwright==1.60.0"]
semantic-review=["typesafe-sdk==0.6.0"]
inspect=["inspect-ai==0.3.268","inspect-swe==0.2.70","openai>=1.0"]
test=["pytest>=8,<10"]

[project.entry-points."agent_workflow.plugins"]
agent-workflow-benchmark="agent_workflow_benchmark.plugin:plugin"

[tool.setuptools]
package-dir={""="src"}
include-package-data=false
[tool.setuptools.packages.find]
where=["src"]
[tool.setuptools.package-data]
agent_workflow_benchmark=["schemas/*.json","assets/**/*","templates/evaluation/*.json"]
