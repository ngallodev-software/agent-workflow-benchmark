name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build 'pytest>=8,<10' 'jsonschema>=4.18,<5' 'agent-workflow-comparative-eval @ git+https://github.com/ngallodev-software/agent-workflow-comparative-eval.git@master' 'agent-workflow @ git+https://github.com/ngallodev-software/agent-workflow.git@master'
      - run: python -c "from importlib import metadata; assert metadata.version('agent-workflow') == '0.11.10'; assert metadata.version('agent-workflow-comparative-eval') == '0.2.0'"
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q tests
      - run: python -m build --sdist --wheel

  inspect-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'agent-workflow-comparative-eval @ git+https://github.com/ngallodev-software/agent-workflow-comparative-eval.git@master' 'agent-workflow @ git+https://github.com/ngallodev-software/agent-workflow.git@master'
      - run: python -m pip install '.[inspect]'
      - run: python -c "from importlib import metadata; assert metadata.version('inspect-ai') == '0.3.268'; assert metadata.version('inspect-swe') == '0.2.70'; import agent_workflow_benchmark.benchmarking.inspect_adjudication"
      - run: python -c "from agent_workflow_benchmark.benchmarking.inspect_adjudication import _inspect_sandbox_spec; spec=_inspect_sandbox_spec(); assert spec.type == 'docker'"
      - run: python -c "from pathlib import Path; from agent_workflow_benchmark.benchmarking.inspect_adjudication import _run_guardrail_probe; report=_run_guardrail_probe(output_root=Path('/tmp/inspect-guardrail'), model='mockllm/model', model_args=None); assert report['passed'] is True"
