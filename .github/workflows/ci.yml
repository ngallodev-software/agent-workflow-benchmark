name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build 'pytest>=8,<10' 'jsonschema>=4.18,<5' 'agent-workflow @ git+https://github.com/ngallodev-software/agent-workflow.git'
      - run: python -c "from importlib import metadata; assert metadata.version('agent-workflow') == '0.11.9', metadata.version('agent-workflow')"
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q tests
      - run: python -m build --sdist --wheel
