name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build 'pytest>=8,<10' 'jsonschema>=4.18,<5' 'agent-workflow-comparative-eval @ git+https://github.com/ngallodev-software/agent-workflow-comparative-eval.git@7d23ac11eb5c0e71dc5a75e2375e09d3333fec53' 'agent-workflow @ git+https://github.com/ngallodev-software/agent-workflow.git@b348d851218b09ceeb18a653c5106670989fd6d4'
      - run: python -c "from importlib import metadata; assert metadata.version('agent-workflow') == '0.12.0'; assert metadata.version('agent-workflow-comparative-eval') == '0.3.2'"
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q tests
      - run: python -m build --sdist --wheel

  inspect-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'agent-workflow-comparative-eval @ git+https://github.com/ngallodev-software/agent-workflow-comparative-eval.git@7d23ac11eb5c0e71dc5a75e2375e09d3333fec53' 'agent-workflow @ git+https://github.com/ngallodev-software/agent-workflow.git@b348d851218b09ceeb18a653c5106670989fd6d4'
      - run: python -m pip install '.[inspect]'
      - run: python scripts/compat/apply-inspect-swe-output-schema-patch.py
      - run: python scripts/compat/verify-inspect-swe-output-schema-patch.py
      - run: bash -n scripts/adjudication/v2-qualify.sh scripts/adjudication/v2-oracle.sh scripts/adjudication/p0b-prepare-resolutions.sh scripts/agentic-jev/p7-freeze-swe-manager-study.sh scripts/agentic-jev/p7-prepare-swe-manager-study.sh scripts/agentic-jev/p7-run-swe-manager-paired.sh
      - run: python -m py_compile scripts/adjudication/v2-diagnose.py scripts/adjudication/v2-codex-lb-ingress-capture.py scripts/adjudication/v2-verify-ingress.py
      - run: python scripts/adjudication/v2-diagnose.py --help
      - run: python scripts/adjudication/v2-codex-lb-ingress-capture.py --help
      - run: python scripts/adjudication/v2-verify-ingress.py --help
      - run: python -c "from importlib import metadata; from inspect import signature; from inspect_ai.log import EvalSample; import inspect_swe; from agent_workflow_benchmark.compat.inspect_swe_output_schema import assert_runtime_capability; assert metadata.version('inspect-ai') == '0.3.268'; assert metadata.version('inspect-swe') == '0.2.71'; assert 'output_schema' in signature(inspect_swe.codex_cli).parameters; assert assert_runtime_capability()['enabled'] is True; assert 'error_retries' in EvalSample.model_fields; assert 'retries' not in EvalSample.model_fields; import agent_workflow_benchmark.benchmarking.inspect_adjudication"
      - run: python -c "from agent_workflow_benchmark.benchmarking.inspect_adjudication import _inspect_sandbox_spec; spec=_inspect_sandbox_spec(); assert spec.type == 'docker'; service=spec.config.services['default']; assert service.cap_drop == ['ALL']; assert service.cap_add == ['CHOWN', 'FOWNER']"
      - run: python -c "from pathlib import Path; from agent_workflow_benchmark.benchmarking.inspect_adjudication import _run_guardrail_probe; report=_run_guardrail_probe(output_root=Path('/tmp/inspect-guardrail'), model='mockllm/model', model_args=None); assert report['passed'] is True"


  agentic-jev-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'agent-workflow-comparative-eval @ git+https://github.com/ngallodev-software/agent-workflow-comparative-eval.git@7d23ac11eb5c0e71dc5a75e2375e09d3333fec53' 'agent-workflow @ git+https://github.com/ngallodev-software/agent-workflow.git@b348d851218b09ceeb18a653c5106670989fd6d4'
      - run: python -m pip install '.[agentic-jev]'
      - run: python -m pip install 'inspect_evals[swe_lancer] @ git+https://github.com/UKGovernmentBEIS/inspect_evals.git@190dfa27bc2e9b3e966ea6e8a682626d55b513c0'
      - run: python -c "from inspect_evals.swe_lancer import swe_lancer; from inspect_evals.swe_lancer.scorers import swe_lancer_scorer; from agent_workflow_benchmark.benchmarking.agentic_jev_swe_manager_v1 import _manager_decision_capture_scorer; t=swe_lancer(task_variant='swe_manager', scorer=[swe_lancer_scorer(), _manager_decision_capture_scorer()], use_user_tool=False, use_per_task_images=False); assert len(t.dataset) >= 30; assert t.version == 1; assert t.metadata['full_task_version'] == '1-B'; assert t.metadata['task_interface_version'] == 'B'"
      - run: python -c "from importlib import metadata; from typesafe_sdk import TypeSafeClient; import agent_workflow_benchmark.benchmarking.agentic_jev as a; assert metadata.version('typesafe-sdk') == '0.6.0'; assert a.agentic_jev_skill_path().is_file(); assert len(a.agentic_jev_skill_sha256()) == 64"
      - run: python -c "from agent_workflow_benchmark.benchmarking.agentic_jev import pilot_treatment_manifest; m=pilot_treatment_manifest(); assert [x['arm_id'] for x in m['arms']] == ['A-baseline','B-skill-only','C-skill-plus-jev']; assert m['tool']['execution_location'] == 'host'"
